<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CodeKids</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--color-bg);
            font-family: 'Fredoka', sans-serif;
            overflow: auto; /* Allow scrolling if needed */
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-header h1 {
            color: var(--color-action);
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
            position: relative;
            z-index: 10;
            pointer-events: auto;
        }

        .form-group input:focus {
            border-color: var(--color-action);
            outline: none;
        }

        .btn-login {
            background-color: var(--color-action);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #1976D2;
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--color-danger);
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1 id="app-title">CodeKids</h1>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn-login">Entrar</button>
            <p class="error-msg" id="error-msg">Usuário ou senha inválidos</p>
        </form>
    </div>

    <script>
        // Load Config for Title (Priority: LocalStorage -> API -> Default)
        function loadConfig() {
            const localConfig = localStorage.getItem('appConfig');
            if (localConfig) {
                const config = JSON.parse(localConfig);
                applyConfig(config);
            } else {
                fetch('/api/config')
                    .then(res => {
                        if (!res.ok) throw new Error('API not available');
                        return res.json();
                    })
                    .then(config => {
                        applyConfig(config);
                        // Cache it
                        localStorage.setItem('appConfig', JSON.stringify(config));
                    })
                    .catch(err => {
                        console.log('Using default config or offline mode');
                    });
            }
        }

        function applyConfig(config) {
            if (config.appName) {
                document.title = `Login - ${config.appName}`;
                document.getElementById('app-title').textContent = config.appName;
            }
        }

        loadConfig();

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            // 1. Try Local/Static Login First (Vercel Compatibility)
            // Hardcoded credential check for static deployment
            if (username === 'admin' && password === '123') {
                localStorage.setItem('auth_user', JSON.stringify({ username: 'admin' }));
                window.location.href = '/';
                return;
            }

            // 2. Try Backend API (Legacy/Local Server)
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        localStorage.setItem('auth_user', JSON.stringify(data.user));
                        window.location.href = '/';
                        return;
                    }
                }
            } catch (error) {
                console.log('Backend login failed, relying on static check');
            }

            // If we get here, login failed
            errorMsg.textContent = 'Usuário ou senha inválidos';
            errorMsg.style.display = 'block';
        });
        
        // Check if already logged in
        const localAuth = localStorage.getItem('auth_user');
        if (localAuth) {
            window.location.href = '/';
        } else {
            // Optional: Check backend session
            fetch('/api/check-auth')
                .then(res => {
                    if (res.ok) return res.json();
                    throw new Error('No backend');
                })
                .then(data => {
                    if (data.authenticated) {
                        localStorage.setItem('auth_user', JSON.stringify(data.user));
                        window.location.href = '/';
                    }
                })
                .catch(() => {});
        }
    </script>
</body>
</html>
