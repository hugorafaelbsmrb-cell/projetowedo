<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Programação Educacional</title>
    <link rel="stylesheet" href="style.css">
    <!-- Blockly Core -->
    <script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
    <!-- Blockly Standard Blocks -->
    <script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>
    <!-- Blockly Languages -->
    <script src="https://unpkg.com/blockly@10.4.3/msg/pt-br.js"></script>
    <!-- Blockly JavaScript Generator -->
    <script src="https://unpkg.com/blockly@10.4.3/javascript_compressed.js"></script>
    <!-- Blockly Field Colour (Required for Color Picker) -->
    <script src="https://unpkg.com/@blockly/field-colour/dist/index.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app-container">
        <!-- Header / Toolbar -->
        <header class="toolbar">
            <div class="logo-area">
                <h1 id="app-logo-text">CodeKids</h1>
                <img id="app-logo-img" src="" alt="Logo" style="display: none; height: 50px;">
            </div>
            
            <div class="controls-area">
                <div class="hardware-select">
                    <select id="hardware-type">
                        <option value="wedo" selected>LEGO WeDo 2.0 (Bluetooth)</option>
                        <option value="arduino">Arduino (USB)</option>
                    </select>
                    <button id="btn-connect" class="btn btn-round btn-blue" title="Conectar">
                        <i data-lucide="plug"></i>
                    </button>
                    <span id="connection-status" class="status-indicator disconnected"></span>
                </div>

                <div class="execution-controls">
                    <button id="btn-run" class="btn btn-round btn-green" title="Executar">
                        <i data-lucide="play"></i>
                    </button>
                    <button id="btn-stop" class="btn btn-round btn-red" title="Parar">
                        <i data-lucide="square"></i>
                    </button>
                </div>

                <div class="file-controls" style="margin-left: 20px; display: flex; gap: 10px;">
                    <button id="btn-save" class="btn btn-round btn-blue" title="Salvar Projeto" style="width: 50px; height: 50px;">
                        <i data-lucide="save"></i>
                    </button>
                    <button id="btn-load" class="btn btn-round btn-blue" title="Carregar Projeto" style="width: 50px; height: 50px;">
                        <i data-lucide="folder-open"></i>
                    </button>
                    <input type="file" id="file-input" accept=".xml" style="display: none;">
                </div>

                <div class="system-controls" style="margin-left: 20px; display: flex; gap: 10px; border-left: 2px solid #ddd; padding-left: 20px;">
                    <button id="btn-settings" class="btn btn-round btn-blue" title="Configurações" style="width: 50px; height: 50px; background-color: #607D8B;">
                        <i data-lucide="settings"></i>
                    </button>
                    <button id="btn-logout" class="btn btn-round btn-red" title="Sair" style="width: 50px; height: 50px;">
                        <i data-lucide="log-out"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <main id="blockly-div"></main>

        <!-- Status/Console Area (Optional, minimal) -->
        <div id="status-bar">
            <span id="status-text">Pronto para começar!</span>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurações do Sistema</h2>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="settings-app-name">Nome do Sistema</label>
                    <input type="text" id="settings-app-name" placeholder="Ex: Escola Tech">
                </div>
                <div class="form-group">
                    <label for="settings-logo-type">Tipo de Logo</label>
                    <select id="settings-logo-type">
                        <option value="text">Texto</option>
                        <option value="image">Imagem (URL)</option>
                    </select>
                </div>
                <div class="form-group" id="logo-url-group" style="display:none;">
                    <label for="settings-logo-url">URL da Logo</label>
                    <input type="text" id="settings-logo-url" placeholder="https://...">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-cancel-settings" class="btn btn-red" style="padding: 10px 20px; width: auto; height: auto; border-radius: 10px;">Cancelar</button>
                <button id="btn-save-settings" class="btn btn-green" style="padding: 10px 20px; width: auto; height: auto; border-radius: 10px;">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
